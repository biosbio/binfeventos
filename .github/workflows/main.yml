name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: binf_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/binf_test?schema=public
      ADMIN_EMAIL: admin@binf.local
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Update npm
        run: npm install --global npm@11
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          set -euo pipefail
          SANDBOX_WEBHOOK_SECRET="$(openssl rand -hex 32)"
          ADMIN_PASSWORD="Ci$(openssl rand -hex 20)A1!"
          ADMIN_MFA_SECRET="$(openssl rand -hex 32 | tr '0123456789abcdef' 'ABCDEFGHIJKLMNOP')"
          MFA_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          SESSION_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$SANDBOX_WEBHOOK_SECRET"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$ADMIN_MFA_SECRET"
          echo "::add-mask::$MFA_ENCRYPTION_KEY"
          echo "::add-mask::$SESSION_SECRET"
          echo "SANDBOX_WEBHOOK_SECRET=$SANDBOX_WEBHOOK_SECRET" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "ADMIN_MFA_SECRET=$ADMIN_MFA_SECRET" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$MFA_ENCRYPTION_KEY" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$SESSION_SECRET" >> "$GITHUB_ENV"
      # Temporário no PR: gera o lockfile atualizado após a migração de majors.
      # Depois de commitar package-lock.json, voltar para npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=moderate
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
